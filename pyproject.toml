[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "apatools"
version = "0.2.0"
description = "Alternative polyadenylation (APA) analysis of bulk and single-cell RNA-seq data, with CLIP integration"
authors = ["Lisa Fournier <lisa.fournier@unibe.ch>"]
readme = "README.md"
repository = "https://github.com/AI-for-RNA-Biology/apatools"
license = "GPL-3.0-only"
packages = [{include = "apatools"}] # editable mode

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "^1.23.4"
pandas = "^1.5.1"
scikit-learn = "^1.1.3"
urllib3 = "^2.0.5"
scanpy = "^1.9.5"
scipy = "^1.11.2"
statsmodels = "^0.14.0"
statannotations = "^0.5.0"
matplotlib = "^3.7.3"
seaborn = "^0.11.2"
gtfparse = "^1.2.1"
joblib = "^1.3.2"
pyyaml = "^6.0"
bulkanalysis = {git = "https://github.com/AI-for-RNA-Biology/bulkanalysis.git"}
cliptools = {git = "https://github.com/AI-for-RNA-Biology/cliptools.git"}
genomemanager = {git = "https://github.com/AI-for-RNA-Biology/genomemanager.git"}
kallistomanager = {git = "https://github.com/AI-for-RNA-Biology/kallistomanager.git"}
omicstools = {git = "https://github.com/AI-for-RNA-Biology/omicstools.git"}
scanalysis = {git = "https://github.com/AI-for-RNA-Biology/scanalysis.git"}

[tool.poetry.group.dev.dependencies]
bandit = "^1.7.4"
black = "^22.10.0"
coverage = "^6.5.0"
flake8 = "^5.0.4"
pre-commit = "^2.20.0"
pytest = "^7.2.0"
pytest-mock = "^3.10.0"
click = "^8.1.3"
